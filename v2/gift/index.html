function dims(i,front){const p=P[i];let w=23+p[3]*.9,h=w*p[5]/p[4];const mx=front?42:54,mn=30;if(h>mx){w*=mx/h;h=mx}if(w>46){h*=46/w;w=46}if(h<mn){const k=Math.min(mn/h,46/w);w*=k;h*=k}if(front){w*=.92;h*=.92}return[w,h]}
function tray(){$("tray").innerHTML=P.map((p,i)=>cat=="all"||p[2]==cat?`<button class="cd${slots.includes(i)?" in":""}" data-i="${i}" aria-pressed="${slots.includes(i)}"><u>${slots.includes(i)?"✓":"+"}</u><img loading="lazy" src="p/${i}.webp" alt=""><b>${p[0]}</b><span>${inr(p[1])}</span></button>`:"").join("")}
function calc(){const it=slots.filter(x=>x!==null),sub=it.reduce((a,i)=>a+P[i][1],0);let pct=0;BD.forEach(([n,d])=>{if(it.length>=n)pct=d});const off=Math.round(sub*pct/100);return{it,sub,pct,off,tot:sub-off}}
function ui(){const c=calc(),n=c.it.length;
 $("fill").style.width=n/MAX*100+"%";document.querySelectorAll(".trk span").forEach((s,k)=>s.classList.toggle("on",n>=BD[k][0]));
 $("nudge").innerHTML=n==0?"Pick up to 5 pieces. <b>3 or more</b> unlock a bundle discount.":n<3?`Add <b>${3-n} more</b> for 5% off`:n==3?"<b>5% off unlocked.</b> Add 1 more for 8%":n==4?"<b>8% off unlocked.</b> Add 1 more for 10%":"<b>10% off unlocked.</b> Your box is full";
 $("sum").innerHTML=n?`${n} piece${n>1?"s":""}${c.pct?` · ${c.pct}% off`:""}<b>${c.off?`<s>${inr(c.sub)}</s>`:""}${inr(c.tot)}</b>`:"No pieces yet<b>₹0</b>";
 $("wrap").disabled=!n;stage.classList.toggle("has",n>0);$("empty").style.opacity=n?0:.6;
 document.querySelectorAll(".cd").forEach(b=>{const on=slots.includes(+b.dataset.i);b.classList.toggle("in",on);b.setAttribute("aria-pressed",on);b.firstChild.textContent=on?"✓":"+"})}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1800)}
function add(i){const s=slots.indexOf(null);if(s<0)return false;slots[s]=i;const[x,y]=SLOT[s],[w,h]=dims(i,s>2);
 const b=document.createElement("div");b.className="bb";b.id="it"+s;b.style.cssText=`left:${x}em;top:${y}em`;
 b.innerHTML=`<img src="p/${i}.webp" alt="${P[i][0]}" style="width:${w}em;height:${h}em;left:${-w/2}em;--r:${(s%2?1:-1)*(6+s*2)}deg">`;
 b.firstChild.onclick=()=>{if(!stage.classList.contains("closed"))rem(i)};$("its").appendChild(b);
 const sh=document.createElement("div");sh.className="ish";sh.id="sh"+s;sh.style.cssText=`left:${x}em;top:${y}em;width:${w*1.05}em;margin-left:${-w*.525}em`;$("shs").appendChild(sh);
 gtag("event","giftbox_add",{item:P[i][0]});return true}
function rem(i){const s=slots.indexOf(i);if(s<0)return;slots[s]=null;const b=$("it"+s),sh=$("sh"+s);b.id="";sh.remove();b.classList.add("out");setTimeout(()=>b.remove(),420);ui()}
$("tray").onclick=e=>{const b=e.target.closest(".cd");if(!b)return;const i=+b.dataset.i;
 if(slots.includes(i))rem(i);else if(!add(i)){b.classList.remove("no");void b.offsetWidth;b.classList.add("no");toast("Your box is full. Tap a piece to take it out.")}ui()};
$("cats").innerHTML=CATS.map(c=>`<button data-c="${c[0]}"${c[0]=="all"?' class="on"':""}>${c[1]}</button>`).join("");
$("cats").onclick=e=>{const b=e.target.closest("button");if(!b)return;cat=b.dataset.c;document.querySelectorAll("#cats button").forEach(x=>x.classList.toggle("on",x==b));tray();$("tray").scrollLeft=0};
$("wrap").onclick=()=>{$("ov").classList.add("on")};
$("ov").onclick=e=>{if(e.target==$("ov"))$("ov").classList.remove("on")};
$("skip").onclick=()=>wrap("","");$("go").onclick=()=>wrap($("fn").value.trim(),$("fm").value.trim());
let T=[];const later=(f,ms)=>T.push(setTimeout(f,ms));
function wrap(n,m){tagName=n;tagMsg=m;$("ov").classList.remove("on");document.activeElement&&document.activeElement.blur();
 const c=calc();$("tn").textContent=n||"Someone special";$("tm").textContent=m;
 $("list").innerHTML=c.it.map(i=>`<div><span>${P[i][0]}</span><span>${inr(P[i][1])}</span></div>`).join("")+(c.off?`<div class="d"><span>Bundle discount (${c.pct}%)</span><span>−${inr(c.off)}</span></div>`:"")+`<div class="t"><span>Total</span><span>${inr(c.tot)}</span></div>`;
 let t="Hi Tejori! I packed a gift box on your website:\n"+c.it.map((i,k)=>`${k+1}. ${P[i][0]} – ${inr(P[i][1])}`).join("\n")+(c.off?`\nSubtotal: ${inr(c.sub)}\nBundle discount (${c.pct}%): −${inr(c.off)}`:"")+`\nTotal: ${inr(c.tot)}`;
 if(n||m)t+=`\n\nGift tag\nFor: ${n||"-"}`+(m?`\nMessage: ${m}`:"");
 $("wa").href="https://wa.me/"+WA+"?text="+encodeURIComponent(t);
 T.forEach(clearTimeout);T=[];stage.classList.add("closed");
 later(()=>stage.classList.add("sealed","tied"),1000);later(()=>stage.classList.add("bowed"),1500);
 later(()=>stage.classList.add("tagged"),1900);later(()=>$("done").classList.add("on"),2700);
 gtag("event","giftbox_wrap",{pieces:c.it.length,value:c.tot})}
$("edit").onclick=()=>{T.forEach(clearTimeout);T=[];$("done").classList.remove("on");stage.classList.remove("tagged","bowed","tied","sealed");later(()=>stage.classList.remove("closed"),250)};
$("wa").onclick=()=>gtag("event","whatsapp_click",{page:"v2-gift"});
$("sps").innerHTML=Array.from({length:16},(_,k)=>{const a=k/16*6.283,d=70+Math.random()*90;return`<i class="sp" style="--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d-30}px;animation-delay:${Math.random()*.25}s"></i>`}).join("");
tray();ui();fit();new ResizeObserver(fit).observe(stage);
</script></body></html>
